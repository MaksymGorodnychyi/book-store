databaseChangeLog:
  - changeSet:
      id: insert-admin-user
      author: Maksym
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@bookstore.com
              - column:
                  name: password
                  value: $2a$10$kITfIt14DKFycY4F0mK21eLDTT3sJePEw/PDxr5FM0z2mI8N60TLO
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: Admin
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: (SELECT id FROM users WHERE email = 'admin@bookstore.com')
              - column:
                  name: role_id
                  valueComputed: (SELECT id FROM roles WHERE name = 'ROLE_ADMIN')
